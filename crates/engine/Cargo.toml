[package]
name = "glm-ssd"
version = "0.1.0"
edition = "2021"
description = "SSD-streaming MoE inference engine for GLM-5.3-Flash"

[[bin]]
name = "glm-ssd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
gguf = { path = "../gguf" }
cuda = { path = "../cuda" }
quants = { path = "../quants" }
fancy-regex = "0.14"
minijinja = { version = "2", features = ["loop_controls", "json", "builtins"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
serde_json = "1"
tiny_http = "0.12"
