[package]
name = "glm-ssd"
version = "0.1.0"
edition = "2021"
description = "SSD-streaming MoE inference engine for GLM-5.3-Flash"
license = "MIT"
repository = "https://github.com/ManyGlue0/GLM-SSD"
readme = "../../README.md"
keywords = ["llm", "inference", "cuda", "moe", "gguf"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "glm-ssd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
gguf = { path = "../gguf" }
cuda = { path = "../cuda" }
quants = { path = "../quants" }
fancy-regex = "0.14"
minijinja = { version = "2", features = ["loop_controls", "json", "builtins"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
serde_json = "1"
tiny_http = "0.12"
# glm-ssd download
futures-util = "0.3"
globset = "0.4"
indicatif = "0.17"
# HTTP/1.1 only on purpose: with HTTP/2 every request would be multiplexed onto ONE TCP
# connection, which caps throughput. N separate connections = N TCP windows.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
