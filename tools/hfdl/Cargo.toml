[package]
name = "hfdl"
version = "0.1.0"
edition = "2021"
description = "Fast, resumable, parallel Hugging Face downloader (range requests + SHA-256 verification)"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
globset = "0.4"
indicatif = "0.17"
# HTTP/1.1 only on purpose: with HTTP/2 every request would be multiplexed onto ONE TCP
# connection, which caps throughput. N separate connections = N TCP windows.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
